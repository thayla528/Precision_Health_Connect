<!DOCTYPE html>

<html lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login Precision Health Connect - Variação Cross</title>
<!-- Bootstrap 5 CSS CDN -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
<!-- Custom Styles -->
<style data-purpose="custom-layout">
        :root {
            --brand-purple: #500989;
            --brand-light: #c084fc;
            --gradient-start: #500989;
            --gradient-end: #ffffff;
        }
        body {
            background: linear-gradient(180deg, var(--gradient-start) 0%, var(--gradient-end) 100%);
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: #212529;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.98);
            border: 1px solid rgba(0, 0, 0, 0.05);
            border-radius: 1.5rem;
            box-shadow: 0 1.5rem 4rem rgba(0, 0, 0, 0.15);
        }
        .hero-section {
            background-color: transparent;
        }
        .bg-precision-purple {
            background-color: var(--brand-purple) !important;
        }
        .text-precision-light {
            color: var(--brand-light) !important;
        }
        .btn-precision {
            background-color: var(--brand-purple);
            color: white;
            border: none;
            padding: 1.1rem;
            font-weight: 700;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(80, 9, 137, 0.3);
        }
        .btn-precision:hover {
            background-color: #3d0769;
            color: white;
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(80, 9, 137, 0.4);
        }
        .btn-precision:active {
            transform: scale(0.98);
        }
        .feature-icon-wrapper {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.1);
            margin-bottom: 0.75rem;
            backdrop-filter: blur(5px);
        }
        .feature-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            font-weight: 700;
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }
        .hero-title {
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
        }
        @media (min-width: 992px) {
            .vh-lg-100 {
                height: 100vh;
            }
            .overflow-lg-auto {
                overflow-y: auto;
            }
        }
        .form-label-custom {
            font-size: 0.75rem;
            font-weight: 700;
            color: #495057;
            text-transform: uppercase;
            margin-bottom: 0.4rem;
        }
        .form-control, .form-select {
            border: 1px solid #dee2e6;
            padding: 0.75rem 1rem;
        }
        .form-control:focus, .form-select:focus {
            border-color: var(--brand-purple);
            box-shadow: 0 0 0 0.25rem rgba(80, 9, 137, 0.15);
        }
        .illustration-container {
            border-radius: 2rem;
            overflow: hidden;
            box-shadow: 0 1rem 3rem rgba(0,0,0,0.1);
            background: white;
        }
    </style>
</head>
<body>
<main class="container-fluid p-0">
<div class="row g-0 vh-lg-100">
<!-- Left Section: Content and Illustration -->
<section class="col-12 col-lg-6 d-flex align-items-center justify-content-center p-4 p-lg-5 text-white hero-section">
<div class="w-100" style="max-width: 640px;">
<!-- Logo -->
<div class="mb-4 mb-lg-5" data-purpose="logo">
<div class="d-flex align-items-center">
<div class="bg-white rounded d-flex align-items-center justify-content-center me-3" style="width: 48px; height: 48px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
<svg fill="none" stroke="currentColor" style="width: 28px; height: 28px; color: var(--brand-purple);" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M13 10V3L4 14h7v7l9-11h-7z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"></path>
</svg>
</div>
<span class="h3 mb-0 fw-bold">Precision Health <span class="text-precision-light">Connect</span></span>
</div>
</div>
<!-- Main Heading -->
<h1 class="display-4 fw-bold mb-4 hero-title">
                    Tecnologia Humanizada para Precisão Clínica.
                </h1>
<!-- Illustration -->
<div class="illustration-container mb-5">
<img alt="Medical cross digital illustration" class="img-fluid w-100" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAZeoBmh_IuOcd_rfIH5HhjtY5vS5Ufpea6PpE-aoxW_jArlo-v9FtAcqaQfgxUrZL_Unhc3eMcRPx43w6Chrsk3AlP4jr7dhWthLX05_NgtiprXWioOOFZfS5MtElCkViek7sVsG0UnT4tWxapXqLVM1kzwqMuM5mpeN6WDOPLdWrWNbzwocq6VJ3A9LzKY86bqZG0YZWuSVYJUc8YE-VfCXg4HFIzOWjpFXG1Inue2o0lwO29To64llCqSr7OimoJuZ-JPdAkxeoU" style="object-fit: cover; max-height: 350px;"/>
</div>
<!-- Feature Icons -->
<div class="row g-4 text-center mb-4" data-purpose="feature-icons">
<!-- Biotech -->
<div class="col-4 d-flex flex-column align-items-center">
<div class="feature-icon-wrapper">
<svg class="text-white" fill="none" stroke="currentColor" style="width: 28px; height: 28px;" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
<span class="feature-label">Biotech</span>
</div>
<!-- Hub -->
<div class="col-4 d-flex flex-column align-items-center">
<div class="feature-icon-wrapper">
<svg class="text-white" fill="none" stroke="currentColor" style="width: 28px; height: 28px;" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
<span class="feature-label">Hub</span>
</div>
<!-- Security -->
<div class="col-4 d-flex flex-column align-items-center">
<div class="feature-icon-wrapper">
<svg class="text-white" fill="none" stroke="currentColor" style="width: 28px; height: 28px;" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
<span class="feature-label">Segurança</span>
</div>
</div>
</div>
</section>
<!-- Right Section: Form -->
<section class="col-12 col-lg-6 d-flex align-items-center justify-content-center p-4 p-lg-5 overflow-lg-auto" data-purpose="form-section">
<div class="w-100 glass-card p-4 p-lg-5" style="max-width: 540px;">
<div class="mb-4 text-center text-lg-start">
<h2 class="h3 fw-bold text-dark">Login</h2>
<p class="text-muted">Acesse sua conta para continuar.</p>
</div>
<form action="#" method="POST"><div class="mb-3"><label class="form-label-custom" for="email">E-mail Profissional</label><input class="form-control form-control-lg" id="email" name="email" placeholder="roberto@clinica.com.br" required="" type="email"/></div><div class="mb-4"><label class="form-label-custom" for="password">Senha</label><input class="form-control form-control-lg" id="password" name="password" placeholder="••••••••" required="" type="password"/></div><div class="d-flex justify-content-between mb-4"><div class="form-check"><input class="form-check-input" id="remember" type="checkbox"/><label class="form-check-label text-muted" for="remember" style="font-size: 0.85rem;">Lembrar de mim</label></div><a class="text-decoration-none" href="#" style="color: var(--brand-purple); font-size: 0.85rem;">Esqueceu a senha?</a></div><button class="btn btn-precision w-100 rounded-3" type="submit">Entrar</button></form>
<p class="mt-4 text-center text-muted" style="font-size: 0.8rem;">Não tem uma conta? <a class="text-decoration-none fw-bold" href="#" style="color: var(--brand-purple);">Solicite seu convite</a></p>
</div>
</section>
</div>
</main>
<!-- Bootstrap 5 JS Bundle CDN -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body></html>
